<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Sādhana — practice tracker</title>
    <meta
      name="description"
      content="A local-first saṅkalpa tracker. Take a vow, keep it on a calendar, and write your way through it. Real pañcāṅga — tithi, nakṣatra and sunrise — computed on your device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2EFE9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sādhana" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F2EFE9'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23B5741F' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%23B5741F'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 32px; line-height: 1.6">
        Sādhana runs entirely in your browser and needs JavaScript for the calendar and the
        pañcāṅga. Your data never leaves this device either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
